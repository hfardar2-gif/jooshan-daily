<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b2d">
  <meta name="description" content="هر روز یک بند از دعای جوشن کبیر با ترجمه فارسی">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>صد روز با جوشن</title>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ذکر روزانه</p>
        <h1>صد روز با جوشن</h1>
      </div>
      <button class="icon-button" id="settingsButton" aria-label="تنظیمات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8 3.5-.1-1.1 1.7-1.3-2-3.4-2 .8a8 8 0 0 0-1.9-1.1L15.4 4h-4l-.3 1.9A8 8 0 0 0 9 7L7.1 6.2l-2 3.4 1.6 1.3a8 8 0 0 0 0 2.2L5.1 14.4l2 3.4L9 17a8 8 0 0 0 2 1.1l.3 1.9h4l.4-1.9a8 8 0 0 0 2-1.1l1.8.8 2-3.4-1.6-1.3L20 12Z"/></svg>
      </button>
    </header>

    <section class="progress-panel" aria-label="پیشرفت دوره">
      <div class="progress-head">
        <span id="dayLabel">روز ۱ از ۱۰۰</span>
        <span id="percentLabel">۰٪</span>
      </div>
      <div class="progress-track"><span id="progressFill"></span></div>
      <div class="streak-row">
        <span class="flame">✦</span>
        <span id="streakLabel">آغاز یک مسیر روشن</span>
      </div>
    </section>

    <section class="prayer-card" id="prayerCard" aria-live="polite">
      <div class="card-ornament">﷽</div>
      <div class="section-chip" id="sectionChip">بند ۱</div>
      <p class="arabic" id="arabicText">در حال آماده‌سازی متن امروز…</p>
      <div class="divider"><span></span><b>✦</b><span></span></div>
      <p class="translation" id="translationText"></p>
    </section>

    <section class="reflection" id="reflection">
      <span>امروز فقط همین یک بند؛ آهسته و با حضور بخوان.</span>
    </section>

    <button class="done-button" id="doneButton" disabled>
      <span class="checkmark">✓</span>
      <span id="doneButtonText">خواندم</span>
    </button>

    <p class="next-note" id="nextNote">پس از خواندن، پیشرفت امروزت را ثبت کن</p>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">
        <h2>تنظیم خواندن</h2>
        <button class="close-button" value="cancel" aria-label="بستن">×</button>
      </div>
      <label class="setting-row">
        <span><b>متن درشت‌تر</b><small>برای خواندن راحت‌تر متن دعا</small></span>
        <input type="checkbox" id="largeTextToggle">
      </label>
      <div class="setting-row static">
        <span><b>پیشرفت شما</b><small id="settingsProgress">۰ بند خوانده شده</small></span>
        <span class="mini-badge" id="settingsBadge">۰/۱۰۰</span>
      </div>
      <button type="button" class="reset-button" id="resetButton">شروع دوبارهٔ دوره</button>
    </form>
  </dialog>

  <div class="celebration" id="celebration" aria-hidden="true"></div>
  <script src="./app.js" defer></script>
</body>
</html>
